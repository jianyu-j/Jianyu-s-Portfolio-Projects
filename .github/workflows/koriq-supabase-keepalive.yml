name: KorIQ – keep Supabase demo awake

# Supabase pauses Free-plan projects that get too little *database* activity in a
# 7-day window; its docs say "a few user requests to the database each day" keep a
# project up. One ping every 3 days was not enough, so this queries the database
# every 4 hours.
#
# If the project gets paused anyway, add a SUPABASE_ACCESS_TOKEN repository secret
# (https://supabase.com/dashboard/account/tokens) and this job resumes it through the
# Management API. Without the secret it fails with a link to resume it by hand.

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  actions: write # re-enable this workflow; GitHub switches schedules off after 60 days without commits

concurrency:
  group: koriq-supabase-keepalive

env:
  # Keep in sync with KorIQ-Tennis-Platform/.env. The anon key is public by design
  # (row-level security limits it to the clubs and ntrp_levels tables when signed out).
  SUPABASE_URL: https://kzhzfwibnfzucffveawg.supabase.co
  SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6aHpmd2libmZ6dWNmZnZlYXdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NjM2OTIsImV4cCI6MjEwNDEzOTY5Mn0.v3uT2XE_8StZYdkemuXocWpTnQoxnOIjJ5j_o5gUjII

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Query the demo database
        id: ping
        continue-on-error: true
        run: |
          set -euo pipefail
          query() {
            curl -sS --fail --max-time 30 --retry 2 --retry-all-errors --retry-delay 15 \
              "$SUPABASE_URL/rest/v1/$1" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY"
          }
          clubs=$(query "clubs?select=id,name&order=name.asc")
          echo "clubs: $clubs"
          echo "$clubs" | grep -q '"club_vancouver"' || { echo "::error::Unexpected clubs response"; exit 1; }
          levels=$(query "ntrp_levels?select=level,sort_order&order=sort_order.asc")
          echo "ntrp_levels: $levels"
          echo "$levels" | grep -q '"1.0-1.5"' || { echo "::error::Unexpected ntrp_levels response"; exit 1; }

      - name: Resume the project if it is paused
        if: steps.ping.outcome == 'failure'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          ref="${SUPABASE_URL#https://}"
          ref="${ref%%.*}"
          dashboard="https://supabase.com/dashboard/project/$ref"

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::The Supabase project is not answering, most likely because it was paused. Resume it at $dashboard, or add a SUPABASE_ACCESS_TOKEN repository secret so this job can resume it automatically."
            exit 1
          fi

          mgmt() { curl -sS --fail-with-body --max-time 30 -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$@"; }
          project_status() {
            local body
            body=$(mgmt "https://api.supabase.com/v1/projects/$ref") || {
              echo "::error::Supabase Management API request failed (check the SUPABASE_ACCESS_TOKEN secret): $body" >&2
              return 1
            }
            jq -r .status <<<"$body"
          }

          status=$(project_status)
          echo "Project status: $status"
          resumed=false
          if [ "$status" = INACTIVE ]; then
            mgmt -X POST "https://api.supabase.com/v1/projects/$ref/restore"
            echo
            echo "Restore requested."
            resumed=true
          fi

          for _ in $(seq 30); do
            [ "$status" = ACTIVE_HEALTHY ] && break
            sleep 30
            status=$(project_status)
            echo "Project status: $status"
          done
          if [ "$status" != ACTIVE_HEALTHY ]; then
            echo "::error::The project did not become healthy (last status: $status). Check $dashboard"
            exit 1
          fi

          # DNS for the project URL can take a few minutes to come back after a restore.
          for _ in $(seq 20); do
            if curl -sS --fail --max-time 30 -o /dev/null "$SUPABASE_URL/rest/v1/clubs?select=id&limit=1" \
                 -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY"; then
              if [ "$resumed" = true ]; then
                echo "::warning::The Supabase project had been paused and was resumed automatically."
              fi
              exit 0
            fi
            sleep 30
          done
          echo "::error::Supabase reports the project healthy but its API is unreachable. Try Restart project under Project Settings > General in $dashboard"
          exit 1

      - name: Keep this schedule enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/koriq-supabase-keepalive.yml/enable"
